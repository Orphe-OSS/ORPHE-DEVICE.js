# package.json の version に対応する tag（v<version>）が無ければ、ビルドして tag を打つ
#
# 運用: `npm version patch` → `git push` するだけ。
#
# main には dist を入れない。dist/browser を含む commit をこの workflow で作り、tag だけを push する。
# jsDelivr はその tag から配信する:
#   https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-DEVICE.js@v<version>/dist/browser/orphe-device.js
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # tag push のためだけに write が要る。書き込みトークンは最後の push step にのみ渡す
    permissions:
      contents: write
    steps:
      # action は SHA で固定する（tag は書き換え可能なため）。更新は dependabot に任せる
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # npm の依存パッケージが動いている間、書き込みトークンを .git に残さない
          persist-credentials: false

      - name: version を読み、tag が既にあるか確認
        id: version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "$VERSION は作成済みのためスキップ"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.exists == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # install script は fsevents（macOS のみ）だけなので ubuntu では無効化して困らない
      - if: steps.version.outputs.exists == 'false'
        run: npm ci --ignore-scripts

      # dist/browser は devDependencies の脆弱性も対象
      - if: steps.version.outputs.exists == 'false'
        run: npm audit --audit-level=high

      - if: steps.version.outputs.exists == 'false'
        run: npm run check

      - if: steps.version.outputs.exists == 'false'
        run: npm run build:browser

      - name: dist/browser を含む commit に tag を打って push（main には push しない）
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f dist/browser
          git commit -m "release $TAG"
          git tag "$TAG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "refs/tags/$TAG"
