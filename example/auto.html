<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORPHE CORE / INSOLE — Auto Profile</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="page">
    <h1>ORPHE CORE / INSOLE — Auto Profile</h1>
    <span class="sub">OrpheCoreInsole + autoProfile()</span>
    <a href="./index.html">← examples</a>
  </header>

  <section class="card">
    <h2><span data-kind>CORE / INSOLE</span>
      <span class="badge" data-state>disconnected</span>
      <span class="device" data-device></span>
    </h2>

    <div class="controls">
      <button data-connect>接続</button>
      <label data-mode-wrap hidden>モード
        <select data-mode></select>
      </label>
      <span class="hint" data-acquisition></span>
    </div>
    <div class="hint" data-fw></div>

    <div class="press-bars" data-kinds="insole" hidden>
      <div class="ch"><div class="bar-track"><div class="bar" data-bar="0"></div></div><div class="val" data-val="0">-</div><div class="name">①つま先内</div></div>
      <div class="ch"><div class="bar-track"><div class="bar" data-bar="1"></div></div><div class="val" data-val="1">-</div><div class="name">②母趾球</div></div>
      <div class="ch"><div class="bar-track"><div class="bar" data-bar="2"></div></div><div class="val" data-val="2">-</div><div class="name">③つま先外</div></div>
      <div class="ch"><div class="bar-track"><div class="bar" data-bar="3"></div></div><div class="val" data-val="3">-</div><div class="name">④中足中</div></div>
      <div class="ch"><div class="bar-track"><div class="bar" data-bar="4"></div></div><div class="val" data-val="4">-</div><div class="name">⑤中足外</div></div>
      <div class="ch"><div class="bar-track"><div class="bar" data-bar="5"></div></div><div class="val" data-val="5">-</div><div class="name">⑥踵</div></div>
    </div>

    <div class="stats" data-kinds="core insole" hidden>
      <span>freq <b data-freq>-</b> Hz</span>
      <span>serial <b data-serial>-</b></span>
      <span>lost <b data-lost>0</b></span>
      <span data-kinds="core">steps <b data-steps>-</b></span>
    </div>
    <table class="values" data-kinds="core insole" hidden>
      <tr><th class="row"></th><th>W</th><th>X</th><th>Y</th><th>Z</th></tr>
      <tr><th class="row">Quat</th><td data-v="quat.w"></td><td data-v="quat.x"></td><td data-v="quat.y"></td><td data-v="quat.z"></td></tr>
      <tr><th class="row">Euler [rad]</th><td></td><td data-v="euler.pitch"></td><td data-v="euler.roll"></td><td data-v="euler.yaw"></td></tr>
      <tr><th class="row">Gyro [dps]</th><td></td><td data-v="converted_gyro.x"></td><td data-v="converted_gyro.y"></td><td data-v="converted_gyro.z"></td></tr>
      <tr><th class="row">Acc [G]</th><td></td><td data-v="converted_acc.x"></td><td data-v="converted_acc.y"></td><td data-v="converted_acc.z"></td></tr>
    </table>

    <div class="log" data-log></div>

    <details class="debug">
      <summary>オプション</summary>
      <div class="controls">
        <label><input type="checkbox" id="shared-reconnect" checked>自動再接続</label>
        <label><input type="checkbox" id="shared-debug" checked>デバッグログ</label>
      </div>
    </details>
  </section>

  <script type="module" src="./auto.ts"></script>
</body>

</html>
